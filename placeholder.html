<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fascinate</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F5F0EB;
        font-family: "Noto Serif SC", "Cormorant Garamond", serif;
        color: #4A3728;
      }
      .wrap { text-align: center; padding: 0 24px; }
      .brand {
        font-size: clamp(28px, 6vw, 48px);
        font-weight: 300;
        letter-spacing: 0.35em;
        margin-bottom: 24px;
      }
      .brand em { font-style: italic; font-weight: 500; }
      .line { width: 48px; height: 1px; background: #C4A882; margin: 0 auto 24px; }
      .note {
        font-size: 14px;
        letter-spacing: 0.2em;
        color: #6B6B4E;
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="brand">FASCINATE<em>.</em></h1>
      <div class="line"></div>
      <p class="note">正在建设 · Coming Soon</p>
    </div>
  </body>
</html>
